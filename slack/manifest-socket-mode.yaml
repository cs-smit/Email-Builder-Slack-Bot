# For running the bot on your own machine or server (python -m emailbot.slack_app).
# api.slack.com/apps → Create New App → From a manifest → paste this.
display_information:
  name: Email Builder
  description: Builds HTML email templates from Figma designs
features:
  bot_user:
    display_name: Email Builder
    always_online: true
  slash_commands:
    - command: /email
      description: Build an email template from a Figma frame
      usage_hint: "<figma link> [notes]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - commands
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
